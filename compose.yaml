name: youtube-transcription

services:
  bot:
    build:
      context: .
    image: youtube-transcription-bot:local
    env_file:
      - path: ${BOT_ENV_FILE:-.env}
        required: true
    init: true
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=1g,mode=1777,noexec,nosuid,nodev
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
